[tool.poetry]
name = "paises"
version = "1.2.0"
description = "Comprehensive country & group data library — 250 countries, 48 groups, typed, zero dependencies"
authors = ["Tomas <tomasgonz@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/tomasgonz/paises"
homepage = "https://github.com/tomasgonz/paises"
keywords = ["countries", "iso", "groups", "international", "geo"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

packages = [
    { include = "paises" }
]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.3"

[tool.poetry.plugins]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
